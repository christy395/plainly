name: Plainly audit regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plainly-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional bot runtime
        run: python -m pip install "websockets>=12,<14"
      - name: Compile interpreter, bytecode, bot and host modules
        run: python -m py_compile plainly.py plainly_bytecode.py plainly_bots.py plainly_host.py plainly_project.py plainly_core.py plainly_core_bytecode.py
      - name: Run audit regression tests
        run: python audit_tests.py
      - name: Run independent Plainly core regression tests
        run: python core_tests.py
      - name: Run independent core bytecode regression tests
        run: python core_bytecode_tests.py
      - name: Run deterministic core fuzz tests
        run: python core_fuzz_tests.py
      - name: Run core bytecode CLI tests
        run: python core_bytecode_cli_tests.py
      - name: Run project manifest security tests
        run: python project_tests.py
      - name: Run bytecode regression tests
        run: python bytecode_tests.py
      - name: Run mocked Discord and Telegram integration tests
        run: python bot_tests.py
      - name: Run hosted website and provider adapter tests
        run: python hosting_tests.py
      - name: Compile and execute a bytecode example
        run: |
          python plainly.py compile hello.plain
          python plainly.py execute hello.pbc
      - name: Test installed package and console command
        run: |
          python -m pip install --no-deps .
          plainly version
          plainly core-check core_hello.plain
          plainly core-run core_hello.plain
          plainly init game CIProject
          plainly project-check CIProject
          plainly compile hello.plain
          plainly execute hello.pbc
      - name: Check and run the independent Plainly core example
        run: |
          python plainly.py core-check core_hello.plain
          python plainly.py core-run core_hello.plain
      - name: Compile and execute independent core bytecode
        run: |
          python plainly.py core-compile core_hello.plain
          python plainly.py core-execute core_hello.core.pbc
      - name: Check and run the compatibility example
        run: |
          python plainly.py check hello.plain
          python plainly.py run hello.plain

  browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run browser regression tests
        run: node web_test.js

  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MinGW-w64 on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build native test program
        run: |
          python plainly.py native speed.plain
          python -c "import os, subprocess; exe = os.path.abspath('speed.exe' if os.name == 'nt' else 'speed'); subprocess.run([exe], check=True)"
