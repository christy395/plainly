[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plainly-lang"
version = "1.5.0"
description = "A programming language written in plain English"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
bots = ["websockets>=12,<14"]

[project.scripts]
plainly = "plainly:cli"

[tool.setuptools]
py-modules = ["plainly", "plainly_bytecode", "plainly_bots", "plainly_host", "plainly_project", "plainly_core"]
