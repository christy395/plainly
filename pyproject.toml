[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plainly-lang"
version = "1.1.1"
description = "A programming language written in plain English"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
plainly = "plainly:cli"

[tool.setuptools]
py-modules = ["plainly"]
